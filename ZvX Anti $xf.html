<style>
  :root {
    --black: #0A0A0A;
    --black-2: #161616;
    --red: #FF2E82;
    --red-dark: #C2185B;
    --orange: #FF7AB0;
    --orange-light: #FFB6D5;
    --bg: #FDEFF5;
    --bg2: #FCE4EF;
    --text: #171717;
    --text-light: #6E6E6E;
    --white: #ffffff;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --shadow-lg: 0 10px 44px rgba(0,0,0,0.20);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Work Sans',sans-serif; color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; line-height:1.5; position:relative;
  }
  body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background:
    radial-gradient(600px circle at 8% 10%, rgba(255,46,130,.16), transparent 60%),
    radial-gradient(640px circle at 90% 85%, rgba(10,10,10,.10), transparent 60%); }
  h1,h2,h3,h4{ font-family:'Montserrat',sans-serif; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
  a{ text-decoration:none; color:inherit; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  .gold-rule{ width:44px; height:3px; background:linear-gradient(90deg,var(--red),var(--orange)); border-radius:2px; margin-bottom:12px; }

  /* placeholder de media */
  .ph{ position:relative; background:linear-gradient(135deg,var(--black) 0%, var(--red-dark) 55%, var(--red) 100%); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; }
  .ph::before{ content:''; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0, rgba(255,255,255,.08) 2px, transparent 2px, transparent 14px); }
  .ph::after{ content:''; position:absolute; top:-30%; left:-25%; width:55%; height:170%; background:linear-gradient(120deg, rgba(255,255,255,.14), rgba(255,255,255,0) 65%); transform:rotate(18deg); pointer-events:none; }
  .ph i{ position:relative; z-index:1; color:rgba(255,255,255,.6); font-size:1.3rem; }
  .ph-label{ position:absolute; bottom:6px; left:7px; z-index:1; font-size:.56rem; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.75); background:rgba(0,0,0,.4); padding:2px 7px; border-radius:20px; backdrop-filter:blur(3px); }

  /* PAGE */
  .page{ max-width:480px; margin:0 auto; min-height:100vh; }

  /* HEADER */
  header{ position:sticky; top:0; z-index:50; background:linear-gradient(150deg,var(--black) 0%, var(--black-2) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 32px rgba(0,0,0,.35); }
  .brand{ display:flex; align-items:center; gap:12px; padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.10); }
  .brand-mark{ width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,var(--red),var(--orange)); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; color:var(--white); font-family:'Anton',sans-serif; font-weight:400; font-size:1.4rem; flex-shrink:0; box-shadow:0 4px 14px rgba(255,46,130,.40); }
  .brand-name{ display:flex; flex-wrap:wrap; column-gap:8px; font-family:'Azonix','Anton',sans-serif; font-weight:400; font-size:1.55rem; line-height:1.05; letter-spacing:.03em; }
  .brand-name .w-vault{ color:var(--red); text-shadow:0 2px 12px rgba(255,46,130,.45); }
  .brand-name .w-prime{ color:var(--white); }
  .brand-tag{ font-size:.64rem; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-top:5px; }

  .tabs{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 14px; }
  .tab{ flex:0 0 auto; padding:6px 11px; border-radius:6px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.05); color:rgba(255,255,255,.7); font-weight:700; font-size:.6rem; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; transition:all .2s; }
  .tab:hover{ color:var(--white); border-color:var(--orange); }
  .tab.active{ background:linear-gradient(120deg,var(--red),var(--orange)); border-color:transparent; color:var(--white); }

  /* CATEGORY */
  .cat-section{ padding:30px 18px 4px; }
  .cat-head{ margin-bottom:18px; }
  .cat-title{ font-size:1.6rem; font-weight:800; color:var(--black); letter-spacing:.04em; }

  /* COURSE CARD */
  .course{ background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.06); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 16px 16px; margin-bottom:22px; content-visibility:auto; contain-intrinsic-size:0 620px; }
  .course-title{ font-family:'Montserrat',sans-serif; font-size:1rem; font-weight:800; color:var(--text); letter-spacing:.03em; line-height:1.2; margin-bottom:10px; }

  .media-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .media-block{ aspect-ratio:1/1; border-radius:9px; }
  .media-row .media-block{ aspect-ratio:3/4; }
  .media-block.video i{ font-size:2rem; }

  .media-single{ margin:0 auto 8px; max-width:58%; }
  .media-single .media-block{ aspect-ratio:16/10; }

  .course-meta{ display:flex; align-items:center; gap:8px; margin:12px 0 14px; flex-wrap:wrap; }
  .meta-tag{ display:inline-flex; align-items:center; gap:6px; font-size:.68rem; font-weight:600; color:var(--text-light); background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.06); border-radius:6px; padding:4px 10px; }
  .meta-tag i{ color:var(--red); font-size:.72rem; }

  .buy-btn{ width:100%; background:linear-gradient(120deg,var(--red),var(--orange)); color:var(--white); font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:13px 18px; border-radius:6px; font-size:.82rem; border:none; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 22px rgba(255,46,130,.40); transition:filter .2s, transform .2s; }
  .buy-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .buy-btn .price{ font-family:'Montserrat',sans-serif; font-weight:800; font-size:1rem; }

  footer{ padding:36px 18px 50px; text-align:center; }
  footer .foot-brand{ display:flex; flex-wrap:wrap; justify-content:center; column-gap:8px; font-family:'Azonix','Anton',sans-serif; font-weight:400; font-size:1.25rem; margin-bottom:8px; letter-spacing:.03em; }
  footer .foot-brand .w-vault{ color:var(--red-dark); }
  footer .foot-brand .w-prime{ color:var(--black); }
  footer p{ font-size:.76rem; color:var(--text-light); max-width:320px; margin:0 auto; }

  .media-block video, .media-block img.real{ width:100%; height:100%; object-fit:cover; border-radius:9px; }
  .media-block video{ cursor:pointer; background:#000; }

  @media (max-width:340px){
    .media-row{ gap:6px; }
    .course-title{ font-size:.9rem; }
  }
</style>

/* ============================================================
   Motor — não é preciso tocar em nada abaixo desta linha
   ============================================================ */
function buildLink(course){
  const msg = `Olá! Quero comprar o pack "${course.title}" por ${course.price}.`;
  const enc = encodeURIComponent(msg);
  const c = course.contact;
  switch(c.type){
    case "whatsapp":  return `https://wa.me/${c.value}?text=${enc}`;
    case "telegram":  return `https://t.me/${c.value}?text=${enc}`;
    case "messenger": return `https://m.me/${c.value}`;
    case "instagram": return `https://ig.me/m/${c.value}`;
    case "email":     return `mailto:${c.value}?subject=${encodeURIComponent('Compra: '+course.title)}&body=${enc}`;
    case "checkout":  return c.value;
    default:          return "#";
  }
}
function contactIcon(type){
  return { whatsapp:"fa-brands fa-whatsapp", telegram:"fa-brands fa-telegram", messenger:"fa-brands fa-facebook-messenger",
           instagram:"fa-brands fa-instagram", email:"fa-solid fa-envelope", checkout:"fa-solid fa-lock" }[type] || "fa-solid fa-arrow-right";
}

function videoBlockHTML(item, idx){
  const label = item.label || `Preview ${idx+1}`;
  if(item.src){
    // data-src em vez de src: só carrega quando o vídeo entra no ecrã (ver lazyLoadMedia)
    return `
    <div class="media-block video">
      <video data-src="${item.src}" loop muted playsinline preload="none" aria-label="${label}"></video>
    </div>`;
  }
  return `
    <div class="media-block video ph" role="button" tabindex="0" aria-label="${label}">
      <i class="fa-solid fa-circle-play"></i>
      <span class="ph-label">${label}</span>
    </div>`;
}
function photoBlockHTML(item){
  const label = item.label || "Photo";
  if(item.src){
    return `
    <div class="media-block">
      <img class="real" src="${item.src}" alt="${label}" loading="lazy" decoding="async" />
    </div>`;
  }
  return `
    <div class="media-block ph" role="img" aria-label="${label}">
      <i class="fa-solid fa-image"></i>
      <span class="ph-label">${label}</span>
    </div>`;
}

function courseHTML(course){
  const videos = (course.videos || []).slice(0,2);
  return `
    <div class="course">
      <div class="course-title">${course.title}</div>
      <div class="gold-rule"></div>

      <div class="media-row videos">${videos.map(videoBlockHTML).join("")}</div>
      <div class="media-single">${photoBlockHTML(course.photo)}</div>

      <div class="course-meta">
        <span class="meta-tag"><i class="fa-solid fa-database"></i>${course.size}</span>
        <span class="meta-tag"><i class="fa-solid fa-bolt"></i>All content is digital. Secure checkout — immediate access after payment.</span>
      </div>

      <button class="buy-btn" onclick="window.open('${buildLink(course)}','_blank')">
        <i class="${contactIcon(course.contact.type)}"></i> BUY NOW — <span class="price">${course.price}</span>
      </button>
    </div>`;
}

function render(activeCatId){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CATEGORIES.map(c =>
    `<button class="tab ${c.id===activeCatId?'active':''}" data-cat="${c.id}">${c.name}</button>`
  ).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=> render(btn.dataset.cat));
  });

  const feed = document.getElementById("feed");
  const catCourses = COURSES.filter(c=>c.category===activeCatId);
  const cat = CATEGORIES.find(c=>c.id===activeCatId);

  feed.innerHTML = `
    <section class="cat-section">
      <div class="cat-head"><h2 class="cat-title">${cat.name}</h2></div>
      ${catCourses.map(courseHTML).join("")}
    </section>`;

  activateVideos();
}

/* Vídeos com src real: só carregam e tocam (autoplay, loop, sem som)
   quando entram no ecrã. Ao sair do ecrã, pausam e libertam o buffer.
   Isto evita que dezenas de vídeos toquem ao mesmo tempo e travem o site.
   Clique liga/desliga o som. */
let videoObserver = null;
function activateVideos(){
  const videos = document.querySelectorAll(".media-block.video video[data-src]");

  if(videoObserver) videoObserver.disconnect();
  videoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const video = entry.target;
      if(entry.isIntersecting){
        if(!video.src && video.dataset.src) video.src = video.dataset.src;
        video.play().catch(()=>{});
      } else {
        video.pause();
      }
    });
  }, { rootMargin: "200px 0px", threshold: 0.25 });

  videos.forEach(video=>{
    videoObserver.observe(video);
    video.addEventListener("click", function(){
      video.muted = !video.muted;
    });
  });
}

render(CATEGORIES[0].id);
